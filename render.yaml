services:
  - type: web
    name: binzo
    runtime: node
    buildCommand: npm ci && npm install --prefix frontend && npm ci --prefix backend && npm run build
    startCommand: npm run start:prod --prefix backend
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://binzo.onrender.com
      - key: VITE_API_BASE_URL
        value: /api
